name: CI/CD Pipeline

on:
  push:
    branches: [ "test" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build with Maven
        run: mvn clean package

      - name: Run Tests
        run: mvn test

      - name: Deploy - Restart PingURL Service
        run: |
          echo "Stopping old service..."
          sudo systemctl stop pingurl || true
          echo "Installing new version..."
          sudo cp target/pingurl-0.0.1-SNAPSHOT.jar /home/gato/pingurl/pingurl.jar
          echo "Starting service..."
          sudo systemctl start pingurl
